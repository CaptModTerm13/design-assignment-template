name: Verilog Auto-Grader

on:
  push:
    branches: [ "main", "master" ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the student's code
      - name: Checkout Student Repository
        uses: actions/checkout@v4
        with:
          path: 'student_repo'

      # Step 2: Parse assignment.yaml to find the Assignment ID
      - name: Read Assignment ID
        id: parse_yaml
        run: |
          cd student_repo
          # GitHub runners have 'yq' pre-installed for parsing YAML
          ASSIGN_ID=$(yq -r '.assignment_id' assignment.yaml)
          echo "ASSIGNMENT_ID=$ASSIGN_ID" >> $GITHUB_ENV
          echo "Preparing to grade: $ASSIGN_ID"

      # Step 3: Securely download your private testbench vault
      - name: Checkout Solutions Repository
        uses: actions/checkout@v4
        with:
          repository: 'Summer-Internship-TKMCE-2026-Design/design-assignment-solution' # <-- CHANGE THIS
          token: ${{ secrets.INSTRUCTOR_TOKEN }}
          path: 'solutions_repo'

      # Step 4: Install the open-source Verilog compiler
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      # Step 5: Compile and Run
      - name: Compile and Simulate
        run: |
          echo "Compiling student design with instructor testbench..."
          
          # Compile src/top.v with the specific assignment testbench
          iverilog -o simulation.out \
            student_repo/src/top.v \
            solutions_repo/${{ env.ASSIGNMENT_ID }}/tb_top.v
          
          echo "Running simulation..."
          vvp simulation.out
